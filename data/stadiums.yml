# International/neutral-site venues — looked up via `GameInfo.venue` (a
# `weekly/week-NN.yml` override), never derived from home/away like the
# 32 team rows above. None of these are a team's home stadium, so `dome`
# here describes the actual venue's roof, not a franchise's. Where a roof
# exists but is not reliably closed for an NFL game, this is flagged
# `dome: false` on the same "don't assume enclosed" principle `week.py`'s
# fail-open default already applies to an unknown stadium.
LONDON_TOT: {dome: false, lat: 51.6043, lon: -0.0665}        # Tottenham Hotspur Stadium
LONDON_WEM: {dome: false, lat: 51.5560, lon: -0.2795}        # Wembley Stadium
MUNICH:     {dome: false, lat: 48.2188, lon: 11.6247}        # Allianz Arena — translucent roof, not treated as enclosed
FRANKFURT:  {dome: false, lat: 50.0685, lon: 8.6455}         # Deutsche Bank Park — retractable, not reliably closed for NFL
MADRID:     {dome: false, lat: 40.4531, lon: -3.6883}        # Santiago Bernabéu — retractable roof, closure unconfirmed for NFL use
MEXICO:     {dome: false, lat: 19.3029, lon: -99.1505}       # Estadio Azteca — open-air
SAO_PAULO:  {dome: false, lat: 23.5453, lon: -46.4742}       # Neo Química Arena — open-air
