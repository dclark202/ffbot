# One of these per week: weekly/week-03.yml, weekly/week-04.yml, etc.
# Produced by the /gameday command's research step (see .claude/commands/
# gameday.md) — you generally don't hand-write this, but every field here
# is safe to hand-edit if a late-breaking report needs a quick fix.
#
# The rule that governs every entry, same as draft/intel.yml: what's
# VERIFIABLE goes in `status`/the games section and moves the math; what's
# SPECULATIVE stays in `note` and never does. A beat writer's hunch is a
# note. An official questionable/out designation is a status.
#
# A missing file, or a missing entry for a given player, is not an error —
# week.py treats "no research" as "no adjustment," never as a crash.

week: 3
generated: "2026-09-16"          # for staleness checks against --week
source_notes: >
  Official injury reports through Sat 4pm ET; NWS forecast pulled Sun
  morning; Vegas lines from [source] as of kickoff -2h.

players:
  "George Pickens":
    status: Q                     # code: "", Q, D, O, IR, ... -- overrides the live Sleeper status when roster_source: sleeper is set
    note: "limited in practice Friday, trending toward playing"

  "Mike Evans":
    status: O
    note: "ruled out, hamstring"

  # `upside` and `volatility` are OPTIONAL spice signals distinct from the
  # draft's meaning of the same words — here they describe THIS WEEK
  # specifically (a get-right spot, a smash-or-bust matchup), not a
  # season-long breakout case. Leave them out for an ordinary week; most
  # players should have no entry at all, or a bare note.
  "Some Boom Bust Guy": "shootout matchup, high spike-week upside; leave in if you're chasing points"

  # `usage_trend`, `momentum`, and `divergence` are also OPTIONAL, 0-100,
  # and all backed by the same "what's VERIFIABLE moves the math" rule as
  # everything else here — these three specifically mean recent, FACTUAL
  # trend (a real target-share climb, a real 3-week scoring run, a real gap
  # between the two), not a hunch about where a player is headed. A beat
  # writer's "due for positive regression" opinion is still a `note`.
  # usage_trend: recent target/air-yards share vs. season average (a role
  #   trend). momentum: recent fantasy points vs. season average (a
  #   scoring trend — see SeasonConfig.momentum_weight's docstring for why
  #   this is graded separately from usage_trend, not folded into it).
  # divergence: role trending up faster than production, or the reverse.
  # These are the SAME fields `ffbot.history.signals` populates for
  # historical replay (usage_form/scoring_form/usage_divergence) — a live
  # researcher supplying them here is what makes the live path match what
  # was backtested, rather than only ever running the weather/Vegas half.
  "Some Role Change Guy":
    note: "target share jumped after the trade, still priced like the old role"
    usage_trend: 78

games:
  # One entry per team with a player worth tracking. `kickoff_et` is the
  # REAL time from that week's actual published schedule — never assume
  # Thu/Sun/Mon; some games are Saturday (routine from mid-December on) and
  # international games (London, Munich, São Paulo) kick off as early as
  # ~9:30am ET. `wind_mph`/`precip_pct` come from a forecast close to
  # kickoff, not a 5-day-out guess. `team_total`/`opp_total` are Vegas
  # implied point totals for each side.
  # `note` is OPTIONAL, one-line researched game-level color (a shootout
  # script, a short week, a backup QB starting) — shown verbatim on the
  # GUI's read-only matchup row, and NEVER a risk-bearing field, same rule
  # as a player's own `note`. Set identically on both sides, same as
  # `venue`/`international` below.
  BUF:
    opponent: MIA
    kickoff_et: "2026-09-21T13:00"
    home: true
    wind_mph: 12
    precip_pct: 10
    team_total: 26.5
    opp_total: 20.0
    note: "Miami's top corner is questionable; expect BUF to lean pass early"
  MIA:
    opponent: BUF
    kickoff_et: "2026-09-21T13:00"
    home: false
    team_total: 20.0
    opp_total: 26.5
    note: "Miami's top corner is questionable; expect BUF to lean pass early"

  # `venue`/`international` only appear when the game is NOT at the home
  # team's usual stadium — a neutral site (data/stadiums.yml has the venue
  # keys, e.g. LONDON_TOT) or an international game. Both are set the same
  # on BOTH teams' entries, since a game is written once per side and the
  # two must agree on where they're playing.
  JAX:
    opponent: NE
    kickoff_et: "2026-10-05T09:30"
    home: true
    venue: LONDON_TOT
    international: true
    team_total: 21.0
    opp_total: 19.5
  NE:
    opponent: JAX
    kickoff_et: "2026-10-05T09:30"
    home: false
    venue: LONDON_TOT
    international: true
    team_total: 19.5
    opp_total: 21.0
