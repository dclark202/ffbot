# Behaviour of the fantasy agent. Tune freely mid-season — nothing here
# requires a code change.

# Sleeper league identity — no OAuth, no credentials, just a league id.
# Run `scripts/whoami.py --username <you>` once to discover league_id and
# roster_id and paste them in here (or leave roster_id unset and it will be
# resolved from username automatically each run).
sleeper:
  league_id: ""
  username: ""
  roster_id: null

# The league's actual scoring rules (see league.yml). Missing file = every
# projection stays on FantasyPros' own consensus PPR scoring, unchanged.
league_file: league.yml

# Meaningful only for a hypothetical future write path -- Sleeper's public
# API has no write capability at all today, so nothing this flag would
# disable actually exists yet. Left on for that reason.
dry_run: true

# Act on a player only once their game is this close to kickoff. Recorded
# for future lock-timing logic -- nothing reads it yet (see docs/GUIDE.md's
# weekly rhythm for what does exist today: /gameday research, then the
# scheduled pre-kickoff check).
lock_window_minutes: 45

# League's starting-slot layout. scripts/whoami.py prints this shape
# straight from Sleeper (no auth needed) -- paste it in here. The draft
# assistant needs this before that call is available, so it has this
# default (a conventional redraft league) until you do.
roster_positions:
  QB: 1
  WR: 2
  RB: 2
  TE: 1
  W/R/T: 1     # flex: WR, RB, or TE
  K: 1
  DEF: 1
  BN: 5
  IR: 1

# How a *missing* projection gets estimated, and how injury status discounts
# one that exists. Not the league's scoring rules — those are league.yml.
projection:
  questionable_multiplier: 0.85  # discount applied to Q players
  doubtful_is_out: true        # treat Doubtful as a hard bench

# WHERE this week's projection numbers come from — a different question from
# projection: above (which only covers estimating a projection that's
# already missing). See docs/REFERENCE.md for the full comparison.
projection_source:
  # "board"   — the frozen preseason board divided down to a per-week rate.
  #             No network, no live data.
  # "sleeper" — real, current weekly projections (and a genuine rest-of-
  #             season total, not the board's frozen one) from
  #             api.sleeper.app, free and unauthenticated. Live as of the
  #             Sleeper migration.
  # "csv"     — the --proj flag: hand-fed FantasyPros weekly export(s).
  source: sleeper

  # How long a fetched week is trusted before being refetched. Only matters
  # for source: sleeper — projections move as practice reports/injury news
  # land through the week.
  cache_ttl_minutes: 180

# WHERE the in-season roster's NAMES come from — a different question from
# projection_source above, which only covers this week's numbers for names
# already on the roster. See docs/REFERENCE.md's manual roster.yml section.
roster_source:
  # "file"    — roster.yml's players: list. No network.
  # "sleeper" — your live Sleeper roster (names, team, injury status,
  #             ownership%) via sleeper.league_id/roster_id. roster.yml
  #             stays relevant even here: it's read as a per-player FLAG
  #             overlay (undroppable/keeper_round/note/blocking), never as
  #             identity. A failed fetch falls back to "file" with a loud
  #             alert, never a crash.
  source: sleeper
  cache_ttl_minutes: 30

# WHERE league.yml's teams:/my_team/my_opponent/week standings block comes
# from. denial_weight/denial_opponent_boost/denial_seed_window and
# season.matchup_variance_weight are all exact no-ops without this
# populated, regardless of their own weight.
standings_source:
  # "file"    — whatever is hand-typed into league.yml's teams: block.
  # "sleeper" — derived live from Sleeper's rosters/users/matchups
  #             endpoints (see ffbot/sleeper_standings.py) and merged UNDER
  #             league.yml — a hand-curated entry there always wins. A
  #             failed fetch falls back to "file" with a loud alert.
  source: sleeper
  cache_ttl_minutes: 30

# WHERE the other 11 teams' rosters come from — the free-agent-pool
# exclusion set that keeps add/drop and waiver-claim recommendations from
# suggesting a player someone else already owns.
league_rosters_source:
  # "file"    — league_rosters.yml, a snapshot scripts/import_league_
  #             rosters.py writes on demand. Goes stale the moment a claim
  #             processes unless something re-runs the script.
  # "sleeper" — every roster fetched fresh on every run (an exact
  #             player_id join, no fuzzy matching, no staleness possible) —
  #             needs only sleeper.league_id. A failed fetch falls back to
  #             the file with a loud alert.
  source: sleeper
  cache_ttl_minutes: 30

# Auto-fetched weather + market game conditions (wind/precip/team totals),
# merged UNDER weekly/week-NN.yml — a human's /gameday research always
# wins. Exists so a run with nobody at the keyboard (see scripts/autorun.py)
# still gets real numbers instead of sitting at a no-op multiplier on
# season.weather_weight/vegas_weight. Each source degrades independently:
# a failed fetch on one never blocks the other, and never crashes the run.
game_conditions:
  weather_source: open_meteo   # "off" | "open_meteo" (free, no key, forecast API)
  odds_source: kalshi          # "off" | "kalshi" (free, no key, public market data)
  cache_ttl_minutes: 180
  # Series Kalshi is allowed to be read from for game-level totals/spread —
  # an allowlist, since Kalshi keeps self-certifying new series.
  kalshi_odds_series: [KXNFLTOTAL, KXNFLSPREAD]

drops:
  # Never drop these, whatever the numbers say. Names as Sleeper spells them.
  never_drop: []
  protect_pct_owned: 60        # protect anyone rostered this widely
  protect_draft_rounds: 4      # protect your first four picks

# scripts/draft.py — the live snake-draft assistant. Works entirely offline;
# everything here is precomputed before the clock starts.
draft:
  num_teams: 12
  my_slot: 1                   # Sleeper randomizes this — override with --slot
  rounds: 14                   # 9 starters + 5 bench (IR isn't drafted)
  my_picks: []                 # keeper/traded-pick overrides; wins when set

  # The draft-side analog of season.spice_level below (1-4: 1=Baseline
  # VOR-chalk, 2=Tactician, 3=Sharp [default], 4=Use at your own risk — see
  # docs/dev/SPICE.md). Setting this resolves DRAFT_SPICE_PRESETS and OVERRIDES
  # every hand-set edge weight further down this block that spice_level
  # itself controls — see DraftConfig.from_spice_level. Matches
  # season.spice_level's own level so "how contrarian" is one number, tuned
  # the same way on both paths.
  spice_level: 3

  # FantasyPros exports, merged by normalized name + position. Order matters:
  # the first source to supply a field wins, so projections (authoritative on
  # points) come first and ADP fills in adp/stdev/bye. Only the flex export
  # carries its own POS column; the single-position pages omit it entirely,
  # hence the explicit position on those three.
  board_csv:
    - draft/proj_flex.csv                        # RB, WR, TE
    - {path: draft/proj_qb.csv,  position: QB}
    - {path: draft/proj_k.csv,   position: K}
    - {path: draft/proj_dst.csv, position: DEF}
    - draft/adp.csv                              # adp + stdev + bye weeks

  # WHERE the frozen board's season-total POINTS come from. "csv" (the old
  # default) uses only board_csv above. "sleeper" overlays live Sleeper
  # season projections on top of it — board_csv still supplies adp/bye/
  # cross-site adp_spread, which Sleeper's endpoint doesn't carry (see
  # CLAUDE.md's "hybrid draft board" design). A failed live fetch falls
  # back to csv-only with a warning, never a crash mid-draft-prep.
  board_points_source: sleeper
  board_points_cache_ttl_minutes: 360

  replacement_depth: 1.0       # multiplier on optimizer-derived starter counts
  depth_weight: 0.35           # value of a player who won't crack your starters

  # How fast a backup loses value once a position is covered. Each one beyond
  # your starters is worth this much of the previous. At 1.0 (the code default)
  # every backup is priced like the first, which drafts seven tight ends —
  # once your starters are full, `need` is zero for everyone and the ranking
  # falls back to raw VOR, which piles into whatever the market undervalues.
  depth_decay: 0.5

  tier_gap_multiplier: 2.0
  tier_min_gap: 5.0

  adp_sigma_floor: 6.0
  adp_sigma_scale: 0.22

  run_window: 10
  run_threshold: 5             # flag a run when >= this many of the last
                                # run_window picks share a position

  fuzzy_threshold: 0.88
  fuzzy_margin: 0.04
  aliases: {}                  # board name -> Sleeper name, for nicknames etc.

  export_defer_positions: [K, DEF]

  # Hard ceilings — once you're at the cap the position stops being
  # recommended. Without these the model drafts seven tight ends: past your
  # starters every candidate's "need" is zero, so the ranking falls back to
  # raw value-over-replacement, which piles into whatever the market
  # underrates. A 7th TE can never be started; no valuation makes him useful.
  position_caps:
    QB: 2
    TE: 2
    K: 1
    DEF: 1

  # Desired final roster shape (softer than the caps above — targets steer,
  # caps are the hard stop). 1 QB + 1 TE + 1 K + 1 DEF + 5 RB + 5 WR = 14
  # picks. Taking a 2nd QB or TE is allowed (cap 2) but costs: the depth term
  # decays past the target, and positions still short of target pull picks
  # toward themselves as the draft runs out.
  position_targets:
    QB: 1
    TE: 1
    RB: 5
    WR: 5

  # Deficit-urgency weight, as a fraction of the pick's decision scale. Now
  # preset-controlled by DRAFT_SPICE_PRESETS (nonzero from level 2 up) —
  # commented out below the same as the ladder's other dials; uncomment to
  # override just this one.
  # balance_weight: 0.3

  recommend_count: 10
  # How often the server polls Sleeper for new picks. Paired with
  # gui_poll_seconds below: a pick is visible after one of each, so leaving
  # this slower than the page poll caps how fresh the page can possibly be
  # no matter how fast the browser asks. Cheap to keep tight — the poll
  # checks a small `last_picked` timestamp first and only pulls the full
  # pick list when it actually moved (see ffbot/draft_sync.py).
  sync_poll_seconds: 3
  # How often the web GUI's own browser tab polls the server for fresh
  # state while a draft is open (drains queued sync picks, refreshes
  # recommendations) — separate from sync_poll_seconds above, which is how
  # often the server itself polls Sleeper. Local-only request, no extra
  # Sleeper traffic, so a tight interval here is cheap: a draft room wants
  # to be current the moment a pick lands, not a beat later.
  gui_poll_seconds: 3

  # --- How contrarian to be ------------------------------------------------
  #
  # These are FRACTIONS of how much value is at stake in the current pick —
  # the gap between the best available player and roughly the 25th best. So
  # 0.45 means "a maximum-upside player is worth up to 45% of that gap."
  #
  # They are fractions rather than point totals on purpose. A player's edge
  # over the field shrinks enormously as the draft goes on (round 1 gaps are
  # 100+ points, round 12 gaps are 2-3), so a fixed point bonus would be a
  # rounding error early and would completely take over the ranking late.
  #
  # Every one defaults to 0.0 in code, so this block is the entire spice dial —
  # zero them out for a plain value-over-replacement board. Tune mid-draft.
  #
  # The dials DRAFT_SPICE_PRESETS controls (upside_weight, risk_weight,
  # volatility_weight, stack_bonus, scoring_arbitrage_weight, risk_ramp_start,
  # risk_ramp_full, kalshi_weight, and — as of B7 — balance_weight above plus
  # team_concentration_weight/same_team_position_weight/bye_collision_weight/
  # block_weight below) are commented out now that draft.spice_level is set
  # above — _draft_from_dict lets ANY key still present in this block
  # override the preset field-by-field, so leaving one uncommented would
  # silently pin it right back to its old hand-set number and make
  # spice_level a partial no-op for that dial. Uncomment any single one to
  # override just that dial without losing the rest of the level's shape.

  # Researched breakout potential from draft/intel.yml.
  # upside_weight: 0.45

  # Researched availability risk (suspension, PUP, holdout, no-timetable
  # injury) — the one intel signal that SUBTRACTS. Factual only; opinions
  # stay as notes. Not round-ramped: a suspension is a fact in every round.
  # risk_weight: 0.35

  # The pre-draft export (board.txt -> Sleeper autopick) bakes intel in at this
  # many season points per full 100 upside/risk, so a disconnection drafts
  # with your researched board, not the naked consensus one. 0 = pure VOR.
  export_intel_scale: 20.0

  # Cross-site ADP disagreement — how much the experts argue about a player,
  # used as a boom/bust proxy. Free signal, needs no research.
  # volatility_weight: 0.30

  # Pairing your QB with his own receiver. Correlated scoring: when they
  # connect for a touchdown, you get paid twice.
  # stack_bonus: 0.20

  # Counterweight to stacking (and to piling up bench pieces in general): a
  # penalty per already-rostered teammate, any position — one QB injury or
  # OL collapse or coordinator change hits every same-team player at once.
  # Small on purpose so a deliberate QB/WR stack still nets positive.
  # team_concentration_weight: 0.06

  # Narrower sibling of the above: an extra penalty for a teammate at the
  # SAME position specifically — two same-team WRs split one target share,
  # a real cost beyond generic same-team risk.
  # same_team_position_weight: 0.10

  # Penalty for a candidate's bye compounding an EXISTING bye-week hole at
  # their position (e.g. a 3rd RB on the same bye as two already rostered,
  # with only one flex to absorb it). Computed exactly via the optimizer,
  # not a naive count — see ffbot/draft.py's `_bye_pressure`. A tiebreak,
  # not a driver: it can only reorder near-equal options, never cost you a
  # materially better player.
  # bye_collision_weight: 0.15

  # RETIRED (B5, 2026-08-11) — backtested confirmed harm at this exact
  # value: scripts/backtest_draft.py isolated arbitrage_weight alone
  # against a zero-edge control over 60 paired full drafts (2021-2023,
  # 20 seeds/season) and found -27.0 season pts, 95% CI [-36.4, -22.2] —
  # excludes zero. Every nonzero value tested trended the same direction.
  # See ffbot/config.py's DraftConfig.arbitrage_weight docstring and
  # docs/dev/BACKTEST.md's B5 section. Do not raise above 0.0 without a fresh
  # backtest.
  arbitrage_weight: 0.0

  # League-scored points minus consensus FantasyPros points (league.yml vs.
  # PPR) — unlike arbitrage_weight, the market can never correct this one,
  # because it isn't playing this league. Usually small — K/DEF carry the
  # two biggest scoring corrections but are excluded from every edge term
  # (see EDGE_EXCLUDED_POSITIONS), so this mostly tiebreaks QBs on whatever
  # your league's INT value is vs. FantasyPros' consensus -1. The SCOR
  # column shows it.
  # scoring_arbitrage_weight: 0.10

  # Floor early, ceiling late. No extra risk in round 1-2, full risk appetite
  # from round 5 on. Lower risk_ramp_full to get weird earlier.
  # risk_ramp_start: 2
  # risk_ramp_full: 5

  # Deny the position an opponent needs, when picks before your next turn
  # belong to teams still missing a starter there — see
  # ffbot/draft.py's `demand_ahead`. Gated by the same contender pool as
  # every other edge term, so it can only reorder players you'd already
  # consider, never talk you into someone you don't otherwise want.
  # block_weight: 0.20

  intel_file: draft/intel.yml

# scripts/week_report.py — the in-season weekly manager. See docs/GUIDE.md
# for the full day-to-day design and docs/REFERENCE.md for what each knob
# below does.
season:
  # The one dial (1-4). 1=Baseline (blind highest-projected-points, no
  # tactics), 2=Tactician (VOR-aware waivers, blocking/denial/bye
  # awareness, still no outside data), 3=Sharp (default — every evidence-
  # backed outside feature on), 4=Use at your own risk (every feature
  # including untested ones like per-player Kalshi odds; deliberately
  # contrarian/high-variance). Sets every weight below; hand-edit any one
  # of them afterward to override just that signal without losing the rest
  # of the level's shape — see SeasonConfig.from_spice_level and
  # docs/dev/SPICE.md for the full feature-by-level breakdown.
  spice_level: 3

  # Which positions the weekly manager scans for a streaming upgrade — the
  # GUI folds these straight into its add/drop recommendations, no per-run
  # input needed. scripts/week_report.py --stream still overrides this for
  # a one-off CLI run.
  stream_positions: [K, DEF]

  # Season-long value blended into this week's number for waiver ranking —
  # 0.0 = pure this-week value, 1.0 = pure rest-of-season value. Stays out
  # of the spice ladder (a marginal-value-based waiver mode is either fully
  # on or fully off — see season.spice_level's waiver_value_mode note —
  # not a dial to ramp within it).
  ros_blend: 0.5

  # How many streaming/waiver candidates to show per position.
  recommend_count: 5

  # How many of the board's best-available free agents to scan per waiver
  # run. 150 comfortably covers every plausible claim.
  waiver_pool_size: 150

  # Floor on how many bench spots must stay classified STREAM regardless of
  # what hold_margin says — a taste for roster optionality, not a slot
  # count. 0 = no floor; core/stream is otherwise fully derived (see
  # week.classify_roster), never hardcoded.
  min_stream_spots: 0

  # Flat season-point bonus for any roster.yml entry flagged `blocking:
  # true` — an explicit, honest admission that a hold is about denying a
  # rival, not your own lineup. 0.0 = no-op. Live now that roster.yml's
  # blocking: flag has somewhere real to attach to (roster_source: sleeper
  # merges it in as a flag overlay) — see roster.example.yml for the field.
  # Modest on purpose: this is a hold-margin nudge for a bench spot you'd
  # otherwise cut, not a reason to bench a real starter. Now preset-
  # controlled by SPICE_PRESETS (nonzero from level 2 up — the "tactical
  # blocking" feature that level names) — commented out below the same as
  # the ladder's other dials; uncomment to override just this one.
  # blocking_hold_bonus: 1.5

  # Weight on denying a contested player to a rival, as a direct points
  # multiplier on the threatened rivals' own lineup gain (see
  # ffbot/denial.py). Needs BOTH league_rosters.yml (scripts/
  # import_league_rosters.py — every rival's real roster) and league.yml's
  # `teams:` standings section (playoff seed, elimination status) to be
  # anything but a no-op; either missing collapses this to exactly 0.0. Both
  # are now live via standings_source: sleeper above and a scheduled
  # `import_league_rosters.py --live` refresh (see scripts/autorun.py).
  # Two effects when nonzero: a rival threatening to grab a real add first
  # folds straight into that add's WAIVERS `net` (ordinary claim urgency),
  # and free agents worth claiming purely to deny — never to start — show
  # up in their own separately flagged DENIAL HOLDS section. No backtest
  # evidence either way yet (unlike the weekly spice ladder's weather/vegas/
  # trend dials) — this is a judgment-set starting value, not a validated
  # one. Now preset-controlled by SPICE_PRESETS (nonzero from level 2 up —
  # the "tactical...denial" feature that level names); commented out below.
  # denial_weight: 0.15

  # Flat boost to a rival's threat score when they're this week's
  # my_opponent (see league.yml/live standings) — denying THEM has a direct
  # effect on your own matchup, not just abstract playoff-bubble pressure.
  # Now preset-controlled by SPICE_PRESETS, same level-2-up basis as
  # denial_weight above.
  # denial_opponent_boost: 0.15

  # How many playoff seeds away from your own still get a proximity boost
  # toward maximum threat, once the season reaches its playoff push (see
  # is_playoff_push). 0 = off. Needs your own seed known (my_team matching
  # a teams: entry) to be anything but a no-op regardless of this value.
  # Now preset-controlled by SPICE_PRESETS, same level-2-up basis as
  # denial_weight above.
  # denial_seed_window: 2

  # Refuse a pure-denial claim (DENIAL HOLDS only, not an ordinary add) when
  # your own rolling priority is this good or better — a denial hold has no
  # lineup value of its own to justify spending a genuinely valuable
  # priority position. 0 = no restriction. Now preset-controlled by
  # SPICE_PRESETS, same level-2-up basis as denial_weight above.
  # denial_priority_floor: 3

  # How many PURE-denial rows (no lineup value of your own — see
  # ffbot/denial.py) may survive into a single weekly recommendations run,
  # after the fungibility discount and streaming-floor bar have already
  # run. Denial is meant to be a rare, high-conviction call, not a routine
  # category with its own row budget the way ordinary adds get
  # recommend_count. 1 = at most the single best denial candidate ever
  # shows up. Not part of the spice ladder.
  denial_row_limit: 1

  # Waivers are always rolling-priority (no FAAB). How expensive spending
  # your current priority is, as a fraction of the claim's own value.
  # Higher = more conservative about spending a
  # good priority position on a marginal add. Now preset-controlled by
  # SPICE_PRESETS (0.0 at level 1 — the naive baseline skips this economic
  # reasoning entirely, same as it skips VOR); commented out below.
  # priority_value: 0.3

  # How much a player's correlation with your LIVE head-to-head opponent's
  # actual started lineup this week can nudge a valuation, as a fraction of
  # decision scale — a same-team QB/pass-catcher stack with one of their
  # starters is discounted; your DEF facing their started skill players is
  # rewarded (see ffbot/week.py's opponent_overlap). Needs
  # standings_source: sleeper above (to resolve which roster is yours and
  # this week's matchup) — the fetch itself is skipped entirely whenever
  # this is 0.0, same "don't even ask" pattern as kalshi_weight. Judgment-
  # set, not backtested: opponent starters are a live-league concept with
  # no historical-replay equivalent, same basis as denial_weight above. Not
  # part of the spice_level ladder — a plain field, present at every level.
  opponent_correlation_weight: 0.12

# Push notifications for scripts/autorun.py's unattended runs (Tuesday
# pre-waiver check, 2h-pre-kickoff checks) — a fired trigger that finds a
# real lineup move or a waiver candidate worth an actual CLAIM sends a
# notification, since nobody's watching the terminal when these fire.
notify:
  # "off" (default) | "ntfy" | "toast" | "both". "ntfy" pushes to your phone
  # via https://ntfy.sh — install the app, pick a private random topic name
  # (it doubles as the secret, since the server is public), subscribe to it
  # in the app, then set BOTH lines below IN config.local.yml, never here —
  # this repo is a public template and a real topic name should never be
  # committed:
  #   notify:
  #     channel: ntfy
  #     ntfy_topic: ffbot-a1b2c3d4-waivers
  # "toast" fires a local Windows notification instead (no phone, no
  # external service, only seen if you're at the machine).
  channel: "off"
  ntfy_server: https://ntfy.sh
  # ntfy_topic: set in config.local.yml, e.g. "ffbot-a1b2c3d4-waivers"

  # A CLAIM-worthy waiver candidate only notifies when its net (season
  # points) is at least this — a week where nothing clears the bar to be
  # worth a real claim should stay quiet.
  min_waiver_net: 0.0
